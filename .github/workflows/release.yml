name: release

# Triggered when a maintainer pushes a `vX.Y.Z` tag. Builds the wheel
# + sdist and uploads them to PyPI via OIDC trusted-publishing — no
# secrets stored in this repo.
#
# Configure the trusted publisher on PyPI before the first run:
#   PyPI -> Account -> Publishing -> Add trusted publisher
#   Owner: xhashmi   Repo: claude-oneclick
#   Workflow: release.yml   Environment: pypi

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write   # required for OIDC token exchange with PyPI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
