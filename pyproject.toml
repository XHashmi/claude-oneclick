[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-oneclick"
version = "0.1.0"
description = "VPN-style one-click toggle to route Claude Code (CLI + VSCode) to custom model endpoints (DeepSeek, NVIDIA NIMs, OpenRouter, Ollama, ...)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "claude-oneclick contributors" }]
keywords = ["claude", "claude-code", "deepseek", "nvidia", "nims", "anthropic", "openai", "proxy", "llm", "router"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
claude-oneclick = "claude_oneclick.cli:main"
coc = "claude_oneclick.cli:main"

[tool.setuptools.packages.find]
include = ["claude_oneclick*"]

[tool.setuptools.package-data]
claude_oneclick = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/*.svg"]
